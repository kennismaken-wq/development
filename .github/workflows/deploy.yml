name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEVELOP_VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEVELOP_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${{ secrets.DEVELOP_VPS_USER }}@${{ secrets.DEVELOP_VPS_HOST }}" '
            set -e
            cd /srv/handigerai/develop-tool
            git fetch origin
            git reset --hard origin/main
            [ -d .venv ] || python3 -m venv .venv
            ./.venv/bin/pip install -q -r requirements.txt
            sudo /usr/bin/systemctl restart develop-tool.service
            sleep 2
            sudo /usr/bin/systemctl is-active develop-tool.service
            for i in 1 2 3 4 5; do
              if curl -sf -o /dev/null http://127.0.0.1:5001/; then
                echo "Healthcheck OK"
                exit 0
              fi
              sleep 2
            done
            echo "Healthcheck FAILED: / gaf geen 200 terug na restart"
            exit 1
          '

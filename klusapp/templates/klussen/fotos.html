{% extends "basis.html" %}
{% block titel %}Galerij{% endblock %}
{% block kop %}Galerij{% endblock %}
{% block inhoud %}
  <form method="get" class="foto-zoekbalk" id="foto-zoekform">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <input type="search" name="q" value="{{ zoek }}" placeholder="Zoek op omschrijving, klus of adres…">
    {% if scope != "altijd" %}<input type="hidden" name="scope" value="{{ scope }}">{% endif %}
  </form>

  <div class="foto-filterrij">
    <div class="klus-kiezer" id="klus-kiezer" data-scope="{{ scope }}">
      <select name="klus" id="klus-select" form="foto-zoekform" class="klus-kiezer-select" onchange="this.form.submit()">
        <option value="" data-scope="altijd">Alle klussen</option>
        <option value="algemeen" data-scope="altijd"{% if klus_pk == "algemeen" %} selected{% endif %}>Algemeen</option>
        {% for klus in klussen %}
          <option value="{{ klus.pk }}" data-scope="{% if klus.actief %}actief{% else %}inactief{% endif %}"{% if klus_pk == klus.pk|stringformat:"s" %} selected{% endif %}>{{ klus.naam }}{% if not klus.actief %} (afgerond){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <noscript><button type="submit" form="foto-zoekform" class="knop-stil">Filteren</button></noscript>
  </div>

  {% include "klussen/_fotoraster.html" with toon_klus=True %}

  {% load static %}
  <script src="{% static 'js/kluskiezer.js' %}"></script>
  <script src="{% static 'js/fotozoeken.js' %}"></script>
{% endblock %}

{% extends "basis.html" %}
{% block titel %}Foto's{% endblock %}
{% block kop %}Foto's{% endblock %}
{% block inhoud %}
  <form method="get" class="foto-zoekbalk" id="foto-zoekform">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <input type="search" name="q" value="{{ zoek }}" placeholder="Zoek op omschrijving, klus of adres…">
  </form>

  <div class="foto-filterrij">
    <label class="weergave-kiezer">
      <select name="klus" form="foto-zoekform" onchange="this.form.submit()">
        <option value="">Alle klussen</option>
        {% for klus in klussen %}
          <option value="{{ klus.pk }}"{% if klus_pk == klus.pk|stringformat:"s" %} selected{% endif %}>{{ klus.naam }}{% if not klus.actief %} (afgerond){% endif %}</option>
        {% endfor %}
      </select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </label>
    <noscript><button type="submit" form="foto-zoekform" class="knop-stil">Filteren</button></noscript>
  </div>

  <h2 class="sectiekop">Foto's</h2>
  {% include "klussen/_fotoraster.html" with toon_klus=True %}

  <h2 class="sectiekop">Documenten</h2>
  {% include "klussen/_documentenlijst.html" %}
{% endblock %}

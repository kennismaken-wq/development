{% extends "basis.html" %}
{% block titel %}Klussen{% endblock %}
{% block kop %}Klussen{% endblock %}
{% block inhoud %}
  <form method="get" class="foto-zoekbalk" id="klus-zoekform">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <input type="search" name="q" value="{{ zoek }}" placeholder="Zoek op naam of adres…">
    {% if toon_alles %}<input type="hidden" name="alles" value="1">{% endif %}
  </form>

  <div class="foto-filterrij">
    <div class="klus-kiezer" id="klus-kiezer">
      <select name="klus" id="klus-select" form="klus-zoekform" class="klus-kiezer-select" onchange="this.form.submit()">
        <option value="" data-scope="altijd">Alle klussen</option>
        {% for klus in alle_klussen %}
          <option value="{{ klus.pk }}" data-scope="{% if klus.actief %}actief{% else %}inactief{% endif %}"{% if klus_pk == klus.pk|stringformat:"s" %} selected{% endif %}>{{ klus.naam }}{% if not klus.actief %} (afgerond){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <noscript><button type="submit" form="klus-zoekform" class="knop-stil">Filteren</button></noscript>
  </div>

  <label class="wisselaar-rij">
    <span class="wisselaar-label">Ook afgeronde klussen tonen</span>
    <span class="wisselaar">
      <input type="checkbox" id="klus-alles-wisselaar" {% if toon_alles %}checked{% endif %}>
      <span class="wisselaar-track"></span>
    </span>
  </label>

  {% include "klussen/_klussenlijst.html" %}

  {% if user.is_eigenaar %}
    <p style="margin-top:1.2rem">
      <a class="knop" href="{% url 'klus_nieuw' %}">Nieuwe klus</a>
    </p>
  {% endif %}

  {% load static %}
  <script src="{% static 'js/kluskiezer.js' %}"></script>
  <script src="{% static 'js/klussenzoeken.js' %}"></script>
{% endblock %}
